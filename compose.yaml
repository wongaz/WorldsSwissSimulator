x-superset: &superset
  build: ./superset
  image: worlds-swiss-superset:5.0.0
  profiles: ["analytics"]
  environment: &superset-environment
    SUPERSET_CONFIG_PATH: /app/local/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:-}
  volumes:
    - superset_data:/app/superset_home

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: worlds_swiss
      POSTGRES_USER: ${SIM_DB_USER:-worlds_swiss}
      POSTGRES_PASSWORD: ${SIM_DB_PASSWORD:?Set SIM_DB_PASSWORD to a nonempty PostgreSQL password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  superset-init:
    <<: *superset
    environment:
      <<: *superset-environment
      SIM_DB_USER: ${SIM_DB_USER:-worlds_swiss}
      SIM_DB_PASSWORD: ${SIM_DB_PASSWORD:?Set SIM_DB_PASSWORD to a nonempty PostgreSQL password}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        python /app/local/bootstrap_database.py &&
        superset db upgrade &&
        superset init &&
        python /app/local/bootstrap_superset.py

  superset:
    <<: *superset
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    command:
      - gunicorn
      - --bind=0.0.0.0:8088
      - --workers=1
      - --threads=4
      - --timeout=120
      - superset.app:create_app()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
  superset_data:
